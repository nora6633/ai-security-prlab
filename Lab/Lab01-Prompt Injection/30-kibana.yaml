apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: kibana}
  template:
    metadata:
      labels: {app: kibana}
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: initialize-kibana-system-password
          image: curlimages/curl:8.10.1
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
          command: ["/bin/sh", "-ec"]
          args:
            - |
              attempt=0
              until curl --insecure --fail --silent -u "elastic:${ELASTIC_PASSWORD}" https://elasticsearch:9200/ >/dev/null; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 90 ]; then
                  echo "Elasticsearch did not become ready" >&2
                  exit 1
                fi
                sleep 2
              done
              curl --insecure --fail --silent --show-error \
                -u "elastic:${ELASTIC_PASSWORD}" \
                -X POST -H 'Content-Type: application/json' \
                -d "{\"password\":\"${ELASTIC_PASSWORD}\"}" \
                https://elasticsearch:9200/_security/user/kibana_system/_password
          volumeMounts:
            - {name: certificates, mountPath: /usr/share/kibana/config/certs, readOnly: true}
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.15.3
          ports:
            - {name: http, containerPort: 5601}
          env:
            - {name: ELASTICSEARCH_HOSTS, value: https://elasticsearch:9200}
            - {name: ELASTICSEARCH_USERNAME, value: kibana_system}
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
            - {name: ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES, value: /usr/share/kibana/config/certs/ca.crt}
            - {name: ELASTICSEARCH_SSL_VERIFICATIONMODE, value: full}
            - {name: XPACK_SECURITY_ENABLED, value: "true"}
            - {name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY, value: lab01-kibana-encryption-key-0000001}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: certificates, mountPath: /usr/share/kibana/config/certs, readOnly: true}
      volumes:
        - name: certificates
          secret:
            secretName: elastic-certificates
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: lab
  annotations:
    portal.lab/port-forwards: "5601:5601"
spec:
  selector: {app: kibana}
  ports:
    - {name: http, port: 5601, targetPort: http}
