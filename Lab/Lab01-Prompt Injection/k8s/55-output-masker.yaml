apiVersion: apps/v1
kind: Deployment
metadata:
  name: output-masker
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: output-masker
  template:
    metadata:
      labels:
        app: output-masker
    spec:
      containers:
        - name: output-masker
          image: lab-output-masker:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 1500Mi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: output-masker
  namespace: lab
spec:
  selector:
    app: output-masker
  ports:
    - name: http
      port: 8000
      targetPort: http
