apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-config
  namespace: lab
data:
  BASEURL: "http://192.168.0.53:12000"
  OPENWEBUI_MODEL: "qwen2.5:7b"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      containers:
        - name: chatbot
          image: lab-chatbot:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: chatbot-config
            - secretRef:
                name: postgres-auth
          env:
            - name: GUARDRAIL_CONFIG
              value: /etc/lab-guardrail/mode.yaml
            - name: CHALLENGE_CONFIG
              value: /etc/lab-challenge/challenge.yaml
            - name: OPENWEBUI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-credentials
                  key: api-key
                  optional: true
          volumeMounts:
            - name: guardrail-policy
              mountPath: /etc/lab-guardrail
              readOnly: true
            - name: challenge-policy
              mountPath: /etc/lab-challenge
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: guardrail-policy
          configMap:
            name: chatbot-guardrail
            items:
              - key: practice.yaml
                path: mode.yaml
        - name: challenge-policy
          configMap:
            name: chatbot-challenge
            items:
              - key: challenge.yaml
                path: challenge.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-unguarded
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-unguarded
  template:
    metadata:
      labels:
        app: chatbot-unguarded
    spec:
      containers:
        - name: chatbot
          image: lab-chatbot:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: chatbot-config
            - secretRef:
                name: postgres-auth
          env:
            - name: GUARDRAIL_CONFIG
              value: /etc/lab-guardrail/mode.yaml
            - name: CHALLENGE_CONFIG
              value: /etc/lab-challenge/challenge.yaml
            - name: OPENWEBUI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-credentials
                  key: api-key
                  optional: true
          volumeMounts:
            - name: guardrail-policy
              mountPath: /etc/lab-guardrail
              readOnly: true
            - name: challenge-policy
              mountPath: /etc/lab-challenge
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: guardrail-policy
          configMap:
            name: chatbot-guardrail-disabled
            items:
              - key: exam.yaml
                path: mode.yaml
        - name: challenge-policy
          configMap:
            name: chatbot-challenge
            items:
              - key: challenge.yaml
                path: challenge.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot
  namespace: lab
  annotations:
    portal.lab/port-forwards: "8000:8000"
spec:
  selector:
    app: chatbot
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-unguarded
  namespace: lab
  annotations:
    portal.lab/port-forwards: "8001:8001"
spec:
  selector:
    app: chatbot-unguarded
  ports:
    - name: http
      port: 8001
      targetPort: http
