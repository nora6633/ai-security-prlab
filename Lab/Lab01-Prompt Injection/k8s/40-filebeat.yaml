apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: lab
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: filestream
        id: lab-container-logs
        enabled: true
        # Only the chatbots: Elasticsearch, Kibana and filebeat logs would bury the chat records.
        paths:
          - /var/log/containers/chatbot-*_lab_*.log
        prospector.scanner.symlinks: true
        parsers:
          - container:
              stream: all
              format: auto
    processors:
      # Keep the startup lines out; they carry no chat activity.
      - drop_event:
          when:
            regexp:
              message: "^(INFO|WARNING):"
      - add_fields:
          target: chat
          fields: {mode: exam}
          when:
            contains:
              log.file.path: "/chatbot-unguarded-"
      - add_fields:
          target: chat
          fields: {mode: practice}
          when:
            not:
              contains:
                log.file.path: "/chatbot-unguarded-"
      - add_fields:
          target: chat
          fields: {event: turn}
          when:
            regexp:
              message: "^user_message: "
      - add_fields:
          target: chat
          fields: {event: input_blocked}
          when:
            regexp:
              message: "^guardrail_alert: "
      - add_fields:
          target: chat
          fields: {event: output_blocked}
          when:
            regexp:
              message: "^output_guardrail_alert: "
      - add_fields:
          target: chat
          fields: {event: tool_call}
          when:
            regexp:
              message: "^tool_call: "
      # message stays intact for the detection rules; the two sides of a turn are split out for search.
      - dissect:
          when:
            regexp:
              message: "^user_message: "
          tokenizer: "user_message: %{user_message} | assistant_response: %{assistant_response}"
          field: message
          target_prefix: chat
          ignore_failure: true
    output.elasticsearch:
      hosts: ["https://elasticsearch:9200"]
      username: elastic
      password: ${ELASTIC_PASSWORD}
      ssl.certificate_authorities: ["/usr/share/filebeat/certs/ca.crt"]
    setup.ilm.enabled: false
    logging.level: info
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: lab
spec:
  selector:
    matchLabels: {app: filebeat}
  template:
    metadata:
      labels: {app: filebeat}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.15.3
          args: ["-e", "-c", "/usr/share/filebeat/config/filebeat.yml", "-strict.perms=false"]
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
          securityContext:
            runAsUser: 0
          resources:
            requests: {cpu: 100m, memory: 150Mi}
            limits: {cpu: 500m, memory: 300Mi}
          volumeMounts:
            - {name: config, mountPath: /usr/share/filebeat/config/filebeat.yml, subPath: filebeat.yml, readOnly: true}
            - {name: containers, mountPath: /var/log/containers, readOnly: true}
            - {name: pods, mountPath: /var/log/pods, readOnly: true}
            - {name: data, mountPath: /usr/share/filebeat/data}
            - {name: certificates, mountPath: /usr/share/filebeat/certs, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: filebeat-config
            defaultMode: 0440
        - name: containers
          hostPath:
            path: /var/log/containers
            type: DirectoryOrCreate
        - name: pods
          hostPath:
            path: /var/log/pods
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: /var/lib/filebeat-data
            type: DirectoryOrCreate
        - name: certificates
          secret:
            secretName: elastic-certificates
            defaultMode: 0440
