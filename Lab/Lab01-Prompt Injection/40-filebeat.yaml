apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: lab
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: filestream
        id: lab-container-logs
        enabled: true
        paths:
          - /var/log/containers/*_lab_*.log
        prospector.scanner.symlinks: true
        parsers:
          - container:
              stream: all
              format: auto
    processors:
      - drop_event:
          when:
            contains:
              message: "plugins.securitySolution.ruleExecution"
    output.elasticsearch:
      hosts: ["https://elasticsearch:9200"]
      username: elastic
      password: ${ELASTIC_PASSWORD}
      ssl.certificate_authorities: ["/usr/share/filebeat/certs/ca.crt"]
    setup.ilm.enabled: false
    logging.level: info
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: lab
spec:
  selector:
    matchLabels: {app: filebeat}
  template:
    metadata:
      labels: {app: filebeat}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.15.3
          args: ["-e", "-c", "/usr/share/filebeat/config/filebeat.yml", "-strict.perms=false"]
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
          securityContext:
            runAsUser: 0
          resources:
            requests: {cpu: 100m, memory: 150Mi}
            limits: {cpu: 500m, memory: 300Mi}
          volumeMounts:
            - {name: config, mountPath: /usr/share/filebeat/config/filebeat.yml, subPath: filebeat.yml, readOnly: true}
            - {name: containers, mountPath: /var/log/containers, readOnly: true}
            - {name: pods, mountPath: /var/log/pods, readOnly: true}
            - {name: data, mountPath: /usr/share/filebeat/data}
            - {name: certificates, mountPath: /usr/share/filebeat/certs, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: filebeat-config
            defaultMode: 0440
        - name: containers
          hostPath:
            path: /var/log/containers
            type: DirectoryOrCreate
        - name: pods
          hostPath:
            path: /var/log/pods
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: /var/lib/filebeat-data
            type: DirectoryOrCreate
        - name: certificates
          secret:
            secretName: elastic-certificates
            defaultMode: 0440
