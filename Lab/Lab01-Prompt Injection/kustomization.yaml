apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab
resources:
  - k8s/00-namespace.yaml
  - k8s/10-postgres.yaml
  - k8s/20-elasticsearch.yaml
  - k8s/30-kibana.yaml
  - k8s/40-filebeat.yaml
  - k8s/50-chatbot.yaml
  - k8s/55-output-masker.yaml
  - k8s/60-alert-rules.yaml
configMapGenerator:
  - name: chatbot-challenge
    files:
      - challenge.yaml
    options:
      disableNameSuffixHash: true
  - name: chatbot-guardrail
    files:
      - modes/practice.yaml
    options:
      disableNameSuffixHash: true
  - name: chatbot-guardrail-disabled
    files:
      - modes/exam.yaml
    options:
      disableNameSuffixHash: true
  - name: elastic-detection-rules
    files:
      - detection/rules_export.ndjson
    options:
      disableNameSuffixHash: true
